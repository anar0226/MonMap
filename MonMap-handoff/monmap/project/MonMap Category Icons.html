<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MonMap — Category Icons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #080c14; font-family: 'Inter', sans-serif; min-height: 100%; }

  .page { padding: 56px 48px 80px; }

  .header { text-align: center; margin-bottom: 56px; }
  .header-logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .header-dot { width: 10px; height: 10px; border-radius: 50%; background: #0053A3; }
  .header-title { font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.92); letter-spacing: -0.03em; }
  .header-sub { font-size: 11px; color: rgba(255,255,255,0.28); letter-spacing: 0.12em; text-transform: uppercase; }

  /* section label */
  .section-label {
    font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.25);
    letter-spacing: 0.14em; text-transform: uppercase;
    margin-bottom: 20px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  /* grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 16px;
    margin-bottom: 48px;
  }

  /* card */
  .card {
    background: #111827;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px 12px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    transition: border-color 0.2s, background 0.2s;
    cursor: default;
  }
  .card:hover { background: #1a2233; border-color: rgba(255,255,255,0.16); }

  .card-meta { text-align: center; }
  .card-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.8); letter-spacing: 0.01em; margin-bottom: 3px; }
  .card-hex  { font-size: 10px; color: rgba(255,255,255,0.28); font-family: 'Courier New', monospace; letter-spacing: 0.05em; }
  .card-key  { font-size: 9.5px; color: rgba(255,255,255,0.18); letter-spacing: 0.04em; margin-top: 2px; }

  /* icon sizes row */
  .sizes-section { margin-bottom: 56px; }
  .sizes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .size-card {
    background: #111827; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 20px 16px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .size-row {
    display: flex; align-items: center; gap: 16px;
  }
  .size-label { font-size: 10px; color: rgba(255,255,255,0.28); letter-spacing: 0.08em; text-transform: uppercase; width: 36px; flex-shrink: 0; }

  /* map preview strip */
  .map-strip {
    background: #e8e0d4; border-radius: 16px; padding: 24px 28px;
    display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: center;
    margin-bottom: 48px;
  }
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="header">
    <div class="header-logo">
      <div class="header-dot"></div>
      <span class="header-title">MonMap</span>
    </div>
    <p class="header-sub">Категорийн дүрсүүд · Category Icons</p>
  </div>

  <!-- All icons grid -->
  <div class="section-label">Бүх категори · All Categories</div>
  <div class="grid" id="iconGrid"></div>

  <!-- Sizes showcase -->
  <div class="section-label">Хэмжээний харьцаа · Sizes</div>
  <div class="sizes-grid" id="sizesGrid"></div>

  <!-- Map preview (light bg like Mapbox Standard) -->
  <div class="section-label" style="margin-top:48px">Газрын зурган дээр · On Map (Mapbox Standard basemap)</div>
  <div class="map-strip" id="mapStrip"></div>

</div>

/* ─── build icon SVG string ──────────────────────────────── */
function makeSVG(key, size, bg) {
  const paths = ICONS[key] || ICONS.fallback;
  const pad = size * 0.22;
  const inner = size - pad * 2;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${size/2}" fill="${bg}"/>
    <g transform="translate(${pad},${pad}) scale(${inner/24})">
      ${paths}
    </g>
  </svg>`;
}

/* ─── map marker SVG (circle dot with white stroke, like app) */
function makeMarker(key, hex) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="38" viewBox="0 0 32 38">
    <circle cx="16" cy="16" r="14" fill="${hex}" stroke="white" stroke-width="2.5"/>
    <g transform="translate(4,4) scale(0.667)">
      ${ICONS[key] || ICONS.fallback}
    </g>
    <line x1="16" y1="30" x2="16" y2="37" stroke="${hex}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="16" cy="37" r="1.5" fill="${hex}"/>
  </svg>`;
}

/* ─── build main grid ────────────────────────────────────── */
const grid = document.getElementById('iconGrid');
CATS.forEach(cat => {
  const card = document.createElement('div');
  card.className = 'card';
  const svgStr = makeSVG(cat.key, 56, cat.hex);
  card.innerHTML = `
    <div>${svgStr}</div>
    <div class="card-meta">
      <div class="card-name">${cat.label}</div>
      <div class="card-hex">${cat.hex}</div>
      <div class="card-key">${cat.key}</div>
    </div>
  `;
  grid.appendChild(card);
});

/* ─── sizes grid ─────────────────────────────────────────── */

const sizeShowcase = [

sizeShowcase.forEach(cat => {
  const card = document.createElement('div');
  card.className = 'size-card';
  card.innerHTML = `
    <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.7);letter-spacing:-0.01em;margin-bottom:4px">${cat.label}</div>
    <div class="size-row">
      <span class="size-label">Map<br>8px</span>
      ${makeSVG(cat.key, 20, cat.hex)}
      <span style="font-size:10px;color:rgba(255,255,255,0.2)">z16 marker</span>
    </div>
    <div class="size-row">
      <span class="size-label">UI<br>24px</span>
      ${makeSVG(cat.key, 28, cat.hex)}
      <span style="font-size:10px;color:rgba(255,255,255,0.2)">list / badge</span>
    </div>
    <div class="size-row">
      <span class="size-label">Card<br>40px</span>
      ${makeSVG(cat.key, 44, cat.hex)}
      <span style="font-size:10px;color:rgba(255,255,255,0.2)">popup header</span>
    </div>
    <div class="size-row">
      <span class="size-label">Hero<br>56px</span>
      ${makeSVG(cat.key, 64, cat.hex)}
      <span style="font-size:10px;color:rgba(255,255,255,0.2)">detail screen</span>
    </div>
  `;
  sizesGrid.appendChild(card);
});

/* ─── map strip ──────────────────────────────────────────── */
const mapStrip = document.getElementById('mapStrip');
CATS.forEach(cat => {
  const wrap = document.createElement('div');
  wrap.style.display = 'flex';
  wrap.style.flexDirection = 'column';
  wrap.style.alignItems = 'center';
  wrap.style.gap = '5px';
  wrap.innerHTML = `
    ${makeMarker(cat.key, cat.hex)}
    <span style="font-size:9.5px;font-family:Inter,sans-serif;color:#555;letter-spacing:0.03em;text-align:center;max-width:56px;line-height:1.3">${cat.label}</span>
  `;
  mapStrip.appendChild(wrap);
});
</script>
</body>
</html>
