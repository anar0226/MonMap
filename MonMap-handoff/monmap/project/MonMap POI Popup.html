<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MonMap — POI Popup Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { 
    width: 100%; height: 100%; 
    background: #0f1117; 
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
  }
  #root { width: 100%; min-height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
/* ─── TWEAK DEFAULTS ─────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#E8A830",
  "variant": "bottomsheet",
  "language": "english",
  "darkMap": true,
  "showBooking": true,
  "reviewCount": 3
}/*EDITMODE-END*/;

/* ─── MOCK DATA ──────────────────────────────────────────── */
const POI_DATA = {
  name: "Zochin Buudal Restaurant",
  nameMN: "Зочин Буудал Ресторан",
  category: "Restaurant & Bar",
  categoryMN: "Ресторан & Бар",
  rating: 4.6,
  reviewCount: 218,
  priceLevel: "₮₮",
  status: "open",
  closingTime: "22:00",
  address: "Sukhbaatar District, 1st Khoroo",
  addressMN: "Сүхбаатар дүүрэг, 1-р хороо",
  phone: "+976 9911-2233",
  tags: ["Traditional", "Mongolian", "Halal", "WiFi"],
  tagsMN: ["Уламжлалт", "Монгол", "Халяал", "WiFi"],
  hours: "08:00 – 22:00",
  website: "zochinbuudal.mn",
  description: "Authentic Mongolian cuisine in the heart of Ulaanbaatar. Famous for khorkhog and tsuivan.",
  descriptionMN: "Улаанбаатарын төвд жинхэнэ монгол хоол. Хорхог, цуйван нь алдартай.",
  nextSlot: "Today, 13:30",
  nextSlotMN: "Өнөөдөр, 13:30",
};

const REVIEWS = [
  { author: "Bilguun T.", rating: 5, time: "2 days ago", timeMN: "2 өдрийн өмнө", text: "The khorkhog was incredible — smoky and tender. Service was warm and attentive. Will definitely come back!", textMN: "Хорхог гайхалтай байлаа. Үйлчилгээ халуун дулаан байсан. Дахин ирнэ!" },
  { author: "Oyunaa B.", rating: 4, time: "1 week ago", timeMN: "1 долоо хоногийн өмнө", text: "Great atmosphere and authentic flavors. The tsuivan is the best in town. A bit crowded on weekends.", textMN: "Гоё орчин, жинхэнэ амт. Цуйван хотын хамгийн сайн. Амралтын өдрүүдэд дүүрэн байдаг." },
  { author: "Gantulga M.", rating: 5, time: "2 weeks ago", timeMN: "2 долоо хоногийн өмнө", text: "A must-visit in Ulaanbaatar. The interior reflects traditional Mongolian culture beautifully.", textMN: "Улаанбаатарт заавал зочлох газар. Дотоод засал нь монгол соёлыг гоёор тусгасан." },
];

/* ─── ICONS (inline SVG) ─────────────────────────────────── */
const Icon = ({ name, size = 16, color = "currentColor" }) => {
  const icons = {
    star: <svg width={size} height={size} viewBox="0 0 16 16" fill={color}><path d="M8 1l1.8 3.6L14 5.4l-3 2.9.7 4.1L8 10.4l-3.7 2 .7-4.1-3-2.9 4.2-.8z"/></svg>,
    starEmpty: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="1.5"><path d="M8 1l1.8 3.6L14 5.4l-3 2.9.7 4.1L8 10.4l-3.7 2 .7-4.1-3-2.9 4.2-.8z"/></svg>,
    location: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"><path d="M8 1.5C5.5 1.5 3.5 3.5 3.5 6c0 3.5 4.5 8.5 4.5 8.5s4.5-5 4.5-8.5c0-2.5-2-4.5-4.5-4.5z"/><circle cx="8" cy="6" r="1.5"/></svg>,
    clock: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 2"/></svg>,
    phone: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"><path d="M3 2h3l1.5 4-2 1.2c1 2 2.3 3.3 4.3 4.3L11 9.5l4 1.5v3c0 1-1 2-2 1.8C5 14 2 9 2 4c-.2-1 .8-2 1-2z"/></svg>,
    globe: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"><circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5C8 1.5 5 4.5 5 8s3 6.5 3 6.5 3-3.5 3-6.5-3-6.5-3-6.5z"/></svg>,
    arrow: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>,
    chevronUp: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><path d="M3 10l5-5 5 5"/></svg>,
    chevronDown: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><path d="M3 6l5 5 5-5"/></svg>,
    close: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>,
    calendar: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"><rect x="1.5" y="3" width="13" height="11.5" rx="2"/><path d="M5 1.5V4M11 1.5V4M1.5 7h13"/></svg>,
    share: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"><circle cx="12.5" cy="3" r="1.5"/><circle cx="12.5" cy="13" r="1.5"/><circle cx="3.5" cy="8" r="1.5"/><path d="M5 8.7l6 3.6M11 4.3L5 7.3"/></svg>,
    save: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"><path d="M8 1.5v9M5 7.5L8 11l3-3.5"/><path d="M2.5 11v2.5c0 .5.5 1 1 1h9c.5 0 1-.5 1-1V11"/></svg>,
    navigate: <svg width={size} height={size} viewBox="0 0 16 16" fill={color}><path d="M2 2l12 5.5-7 1.5-1.5 7z"/></svg>,
    restaurant: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"><path d="M5 1.5V8.5M3 3.5C3 3.5 3 6 5 6s2-2.5 2-2.5M5 8.5V14.5M11 1.5v13M9 1.5v5h4v-5"/></svg>,
    wifi: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"><path d="M1 6c1.9-1.9 4.5-3 7-3s5.1 1.1 7 3"/><path d="M3.5 8.5c1.2-1.2 2.8-2 4.5-2s3.3.8 4.5 2"/><path d="M6 11c.6-.6 1.3-1 2-1s1.4.4 2 1"/><circle cx="8" cy="13.5" r="1" fill={color}/></svg>,
    tag: <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"><path d="M2 2h5.5l6 6a1.5 1.5 0 010 2.1l-3.4 3.4a1.5 1.5 0 01-2.1 0L2 7.5V2z"/><circle cx="5.5" cy="5.5" r="1" fill={color}/></svg>,
  };
  return icons[name] || null;
};

/* ─── STAR RATING ────────────────────────────────────────── */
const StarRating = ({ rating, size = 12, accent }) => {
  return (
    <span style={{ display: 'flex', gap: 2, alignItems: 'center' }}>
      {[1,2,3,4,5].map(i => (
        <span key={i} style={{ color: i <= Math.round(rating) ? accent : 'rgba(255,255,255,0.2)' }}>
          <Icon name="star" size={size} color="currentColor" />
        </span>
      ))}
    </span>
  );
};

/* ─── MAP BACKGROUND ─────────────────────────────────────── */
const MapBG = ({ dark }) => {
  const bg = dark ? '#0e1520' : '#e8e0d0';
  const road = dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.1)';
  const block = dark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.06)';
  return (
    <svg width="100%" height="100%" viewBox="0 0 390 400" preserveAspectRatio="xMidYMid slice" style={{ position: 'absolute', inset: 0 }}>
      <rect width="390" height="400" fill={bg}/>
      {/* City blocks */}
      <rect x="20" y="30" width="80" height="60" rx="4" fill={block}/>
      <rect x="110" y="30" width="60" height="40" rx="4" fill={block}/>
      <rect x="180" y="20" width="90" height="50" rx="4" fill={block}/>
      <rect x="280" y="30" width="90" height="70" rx="4" fill={block}/>
      <rect x="20" y="110" width="50" height="80" rx="4" fill={block}/>
      <rect x="80" y="100" width="90" height="50" rx="4" fill={block}/>
      <rect x="200" y="90" width="70" height="60" rx="4" fill={block}/>
      <rect x="290" y="120" width="80" height="40" rx="4" fill={block}/>
      <rect x="20" y="200" width="110" height="50" rx="4" fill={block}/>
      <rect x="180" y="170" width="80" height="70" rx="4" fill={block}/>
      <rect x="280" y="180" width="90" height="80" rx="4" fill={block}/>
      <rect x="50" y="270" width="60" height="90" rx="4" fill={block}/>
      <rect x="140" y="260" width="100" height="60" rx="4" fill={block}/>
      <rect x="270" y="280" width="110" height="70" rx="4" fill={block}/>
      {/* Roads */}
      <rect x="0" y="88" width="390" height="10" fill={road}/>
      <rect x="0" y="158" width="390" height="8" fill={road}/>
      <rect x="0" y="250" width="390" height="10" fill={road}/>
      <rect x="170" y="0" width="8" height="400" fill={road}/>
      <rect x="270" y="0" width="6" height="400" fill={road}/>
      <rect x="70" y="0" width="6" height="400" fill={road}/>
      {/* POI markers */}
      <circle cx="195" cy="140" r="14" fill={dark ? '#E8A830' : '#c97a10'} opacity="0.9"/>
      <circle cx="195" cy="140" r="14" fill="none" stroke="white" strokeWidth="2"/>
      <text x="195" y="144" textAnchor="middle" fill="white" fontSize="10" fontFamily="DM Sans, sans-serif" fontWeight="700">🍽</text>
      {/* Other POIs */}
      <circle cx="100" cy="120" r="8" fill={dark ? '#4a7c9e' : '#2563a0'} opacity="0.7"/>
      <circle cx="310" cy="200" r="8" fill={dark ? '#6b7280' : '#4b5563'} opacity="0.7"/>
      <circle cx="150" cy="290" r="8" fill={dark ? '#6b7280' : '#4b5563'} opacity="0.7"/>
    </svg>
  );
};

/* ─── COVER PHOTO PLACEHOLDER ────────────────────────────── */
const CoverPhoto = ({ height = 180, accent }) => (
  <div style={{
    width: '100%', height,
    background: `linear-gradient(135deg, oklch(28% 0.04 45) 0%, oklch(22% 0.06 50) 100%)`,
    position: 'relative', overflow: 'hidden', flexShrink: 0,
  }}>
    {/* Striped pattern */}
    <svg width="100%" height="100%" style={{ position: 'absolute', inset: 0, opacity: 0.15 }}>
      <defs>
        <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="10" height="20" fill="white" opacity="0.5"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#stripes)"/>
    </svg>
    <div style={{
      position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center', gap: 6
    }}>
      <span style={{ fontSize: 28, opacity: 0.7 }}>🏛</span>
      <span style={{ color: 'rgba(255,255,255,0.45)', fontSize: 10, fontFamily: 'monospace', letterSpacing: '0.08em' }}>restaurant interior photo</span>
    </div>
    {/* Gradient overlay bottom */}
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0, height: 60,
      background: 'linear-gradient(to top, rgba(15,21,32,0.9), transparent)'
    }}/>
  </div>
);

/* ─── TAG PILL ───────────────────────────────────────────── */
const Tag = ({ label, accent }) => (
  <span style={{
    display: 'inline-flex', alignItems: 'center', gap: 4,
    padding: '3px 10px', borderRadius: 999,
    background: `${accent}22`, border: `1px solid ${accent}44`,
    color: accent, fontSize: 11, fontWeight: 500, whiteSpace: 'nowrap',
  }}>{label}</span>
);

/* ─── INFO ROW ───────────────────────────────────────────── */
const InfoRow = ({ icon, children, accent }) => (
  <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
    <span style={{ color: accent, flexShrink: 0, marginTop: 1 }}>
      <Icon name={icon} size={14} color="currentColor"/>
    </span>
    <span style={{ color: 'rgba(255,255,255,0.7)', fontSize: 12.5, lineHeight: 1.5 }}>{children}</span>
  </div>
);

/* ─── REVIEW CARD ────────────────────────────────────────── */
const ReviewCard = ({ review, lang, accent }) => (
  <div style={{
    background: 'rgba(255,255,255,0.04)',
    border: '1px solid rgba(255,255,255,0.08)',
    borderRadius: 12, padding: '12px 14px', flexShrink: 0,
    width: 230,
  }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
      <span style={{ fontWeight: 600, fontSize: 12.5, color: 'rgba(255,255,255,0.9)' }}>{review.author}</span>
      <StarRating rating={review.rating} size={10} accent={accent}/>
    </div>
    <p style={{ fontSize: 11.5, color: 'rgba(255,255,255,0.55)', lineHeight: 1.55, marginBottom: 6 }}>
      {lang === 'mongolian' ? review.textMN : review.text}
    </p>
    <span style={{ fontSize: 10.5, color: 'rgba(255,255,255,0.3)' }}>
      {lang === 'mongolian' ? review.timeMN : review.time}
    </span>
  </div>
);

/* ─── ACTION BUTTON ──────────────────────────────────────── */
const ActionBtn = ({ label, primary, accent, onClick, small }) => (
  <button onClick={onClick} style={{
    padding: small ? '8px 16px' : '13px 20px',
    borderRadius: 12, border: 'none', cursor: 'pointer',
    fontFamily: 'DM Sans, sans-serif',
    fontWeight: 600, fontSize: small ? 12 : 14,
    background: primary ? accent : 'rgba(255,255,255,0.08)',
    color: primary ? '#0e1520' : 'rgba(255,255,255,0.85)',
    transition: 'opacity 0.15s',
    flexShrink: 0,
  }}
    onMouseEnter={e => e.currentTarget.style.opacity = '0.85'}
    onMouseLeave={e => e.currentTarget.style.opacity = '1'}
  >{label}</button>
);

/* ─── ICON BUTTON ────────────────────────────────────────── */
const IconBtn = ({ icon, label, accent }) => (
  <button style={{
    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5,
    background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.1)',
    borderRadius: 12, padding: '10px 0', cursor: 'pointer', flex: 1,
  }}>
    <span style={{ color: accent }}><Icon name={icon} size={18} color="currentColor"/></span>
    <span style={{ fontSize: 10.5, color: 'rgba(255,255,255,0.55)', fontFamily: 'DM Sans, sans-serif' }}>{label}</span>
  </button>
);

/* ═══════════════════════════════════════════════════════════
   VARIANT A — BOTTOM SHEET
═══════════════════════════════════════════════════════════ */
const BottomSheet = ({ poi, reviews, lang, accent, showBooking, expanded, onToggle }) => {
  const t = (en, mn) => lang === 'mongolian' ? mn : en;
  const sheetH = expanded ? 580 : 220;

  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0,
      height: sheetH, transition: 'height 0.35s cubic-bezier(.32,.72,0,1)',
      background: 'linear-gradient(180deg, rgba(15,21,32,0.97) 0%, #0d1420 100%)',
      borderRadius: '20px 20px 0 0',
      backdropFilter: 'blur(20px)',
      border: '1px solid rgba(255,255,255,0.1)',
      borderBottom: 'none',
      overflow: 'hidden',
      display: 'flex', flexDirection: 'column',
    }}>
      {/* Drag handle */}
      <div style={{ display: 'flex', justifyContent: 'center', padding: '10px 0 2px' }}>
        <div style={{ width: 36, height: 4, borderRadius: 2, background: 'rgba(255,255,255,0.2)', cursor: 'pointer' }} onClick={onToggle}/>
      </div>

      {/* Header row */}
      <div style={{ padding: '8px 18px 10px', display: 'flex', gap: 12, alignItems: 'flex-start' }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 2 }}>
            <span style={{ 
              background: `${accent}22`, color: accent, 
              fontSize: 10, fontWeight: 600, padding: '2px 8px', borderRadius: 999,
            }}>{t(poi.category, poi.categoryMN)}</span>
            <span style={{
              background: poi.status === 'open' ? 'rgba(52,211,153,0.15)' : 'rgba(239,68,68,0.15)',
              color: poi.status === 'open' ? '#34d399' : '#ef4444',
              fontSize: 10, fontWeight: 600, padding: '2px 8px', borderRadius: 999,
            }}>{poi.status === 'open' ? t('Open','Нээлттэй') : t('Closed','Хаалттай')} · {poi.closingTime}</span>
          </div>
          <h2 style={{ 
            fontFamily: 'Playfair Display, serif', fontWeight: 700,
            fontSize: 17, color: 'rgba(255,255,255,0.95)', lineHeight: 1.2,
            whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis'
          }}>{t(poi.name, poi.nameMN)}</h2>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 4 }}>
            <StarRating rating={poi.rating} size={11} accent={accent}/>
            <span style={{ fontSize: 12.5, fontWeight: 600, color: accent }}>{poi.rating}</span>
            <span style={{ fontSize: 11.5, color: 'rgba(255,255,255,0.4)' }}>({poi.reviewCount} {t('reviews','үнэлгээ')})</span>
            <span style={{ fontSize: 11.5, color: 'rgba(255,255,255,0.4)' }}>· {poi.priceLevel}</span>
          </div>
        </div>
        <button onClick={onToggle} style={{
          width: 32, height: 32, borderRadius: 999, border: 'none',
          background: 'rgba(255,255,255,0.08)', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
          color: 'rgba(255,255,255,0.5)',
        }}>
          <Icon name={expanded ? 'chevronDown' : 'chevronUp'} size={14} color="currentColor"/>
        </button>
      </div>

      {/* Quick actions */}
      <div style={{ padding: '0 18px 12px', display: 'flex', gap: 8 }}>
        <IconBtn icon="navigate" label={t('Directions','Чиглэл')} accent={accent}/>
        <IconBtn icon="phone" label={t('Call','Залгах')} accent={accent}/>
        <IconBtn icon="save" label={t('Save','Хадгалах')} accent={accent}/>
        <IconBtn icon="share" label={t('Share','Хуваалцах')} accent={accent}/>
      </div>

      {/* EXPANDED CONTENT */}
      {expanded && (
        <div style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', paddingBottom: 16 }}>
          {/* Cover photo */}
          <CoverPhoto height={140} accent={accent}/>

          {/* Tags */}
          <div style={{ display: 'flex', gap: 6, padding: '14px 18px 4px', flexWrap: 'wrap' }}>
            {(lang === 'mongolian' ? poi.tagsMN : poi.tags).map(tag => (
              <Tag key={tag} label={tag} accent={accent}/>
            ))}
          </div>

          {/* Info */}
          <div style={{ padding: '10px 18px', display: 'flex', flexDirection: 'column', gap: 8 }}>
            <InfoRow icon="location" accent={accent}>{t(poi.address, poi.addressMN)}</InfoRow>
            <InfoRow icon="clock" accent={accent}>{poi.hours}</InfoRow>
            <InfoRow icon="phone" accent={accent}>{poi.phone}</InfoRow>
          </div>

          {/* Booking section */}
          {showBooking && (
            <div style={{
              margin: '6px 18px 10px',
              background: `linear-gradient(135deg, ${accent}18, ${accent}08)`,
              border: `1px solid ${accent}33`, borderRadius: 14, padding: '12px 14px',
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <p style={{ fontSize: 11, color: 'rgba(255,255,255,0.5)', marginBottom: 2 }}>
                    {t('Next available slot','Дараагийн боломжит цаг')}
                  </p>
                  <p style={{ fontSize: 14, fontWeight: 700, color: accent }}>
                    {t(poi.nextSlot, poi.nextSlotMN)}
                  </p>
                </div>
                <ActionBtn label={t('Book Now','Захиалах')} primary accent={accent} small/>
              </div>
            </div>
          )}

          {/* Reviews */}
          <div style={{ padding: '4px 18px 0' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>

  const [sheetExpanded, setSheetExpanded] = React.useState(false);
  if (!tweaks) return null;
  const { accentColor: accent, variant, language, darkMap, showBooking } = tweaks;

  return (
    <div style={{ minHeight: '100vh', background: '#080c14', padding: '40px 40px 60px', display: 'flex', flexDirection: 'column', gap: 60 }}>
      {/* Header */}
      <div style={{ textAlign: 'center' }}>
        <div style={{ display: 'inline-flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
          <div style={{ width: 32, height: 32, borderRadius: 8, background: accent, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Icon name="location" size={16} color="#0d1420"/>
          </div>
          <span style={{ fontFamily: 'Playfair Display, serif', fontSize: 24, fontWeight: 700, color: 'rgba(255,255,255,0.9)' }}>MonMap</span>
        </div>
        <p style={{ fontSize: 13, color: 'rgba(255,255,255,0.35)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>
          POI Popup — Design Exploration
        </p>
      </div>

      {/* Three variants side by side */}
      <div style={{ display: 'flex', gap: 48, justifyContent: 'center', flexWrap: 'wrap' }}>

        {/* A — Bottom Sheet */}
        <PhoneMock label="A — Bottom Sheet" dark={darkMap}>
          <BottomSheet
            poi={POI_DATA} reviews={REVIEWS}
            lang={language} accent={accent} showBooking={showBooking}
            expanded={sheetExpanded} onToggle={() => setSheetExpanded(p => !p)}
          />
        </PhoneMock>

        {/* B — Floating Card */}
        <PhoneMock label="B — Floating Card" dark={darkMap}>
          <FloatingCard
            poi={POI_DATA} reviews={REVIEWS}
            lang={language} accent={accent} showBooking={showBooking}
          />
        </PhoneMock>

        {/* C — Full Modal */}
        <PhoneMock label="C — Full Detail Modal" dark={darkMap}>
          <FullModal
            poi={POI_DATA} reviews={REVIEWS}
            lang={language} accent={accent} showBooking={showBooking}
          />
        </PhoneMock>

      </div>

      {/* Tweaks panel */}
      <TweaksPanel>
        <TweakSection title="Appearance">
          <TweakColor id="accentColor" label="Accent color" value={accent} onChange={v => setTweak('accentColor', v)}/>
          <TweakToggle id="darkMap" label="Dark map" value={darkMap} onChange={v => setTweak('darkMap', v)}/>
        </TweakSection>
        <TweakSection title="Content">
          <TweakToggle id="showBooking" label="Show booking" value={showBooking} onChange={v => setTweak('showBooking', v)}/>
          <TweakRadio id="language" label="Language" value={language}
            options={[{value:'english',label:'EN'},{value:'mongolian',label:'МН'}]}
            onChange={v => setTweak('language', v)}/>
        </TweakSection>
        <TweakSection title="Quick actions">
          <TweakButton label="Expand bottom sheet" onClick={() => setSheetExpanded(p => !p)}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
