<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MonMap — Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #080c14; font-family: 'Inter', sans-serif; min-height: 100%; }
  #root { min-height: 100vh; }

  /* contour drift */
  @keyframes contourPulse {
    0%, 100% { transform: scale(1);   opacity: 0.35; }
    50%      { transform: scale(1.06); opacity: 0.18; }
  }
  @keyframes contourPulse2 {
    0%, 100% { transform: scale(1);   opacity: 0.20; }
    50%      { transform: scale(1.10); opacity: 0.05; }
  }
  @keyframes contourPulse3 {
    0%, 100% { transform: scale(1);   opacity: 0.10; }
    50%      { transform: scale(1.16); opacity: 0.00; }
  }
  @keyframes wordRise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes barFill {
    from { width: 0%; }
    to   { width: 100%; }
  }
  @keyframes dotIn {
    0%   { opacity: 0; transform: scale(0.4); }
    60%  { opacity: 1; transform: scale(1.15); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes pinDrop {
    0%   { opacity: 0; transform: translateY(-24px) scale(0.85); }
    70%  { opacity: 1; transform: translateY(2px) scale(1); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes ringRipple {
    0%   { transform: scale(0.5); opacity: 0.5; }
    100% { transform: scale(2.4); opacity: 0; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">


const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "variant": "dark",
  "showTagline": true,
  "playAnimation": true
}/*EDITMODE-END*/;

/* ─── design tokens ─────────────────────────────────────── */
const T = {
  bg: '#0d1117',
  blue: '#0053A3',
  blueLite: '#1a6fc4',
  textHi: 'rgba(255,255,255,0.95)',
  textMid: 'rgba(255,255,255,0.55)',
  textLo: 'rgba(255,255,255,0.30)'
};

/* ─── the mark (matches logo file) ──────────────────────── */
const Mark = ({ size = 96, color = '#0053A3', dot = 'white', animate = false }) => {
  const s = size,k = s / 72;
  const cx = 36 * k,cy = 30 * k;
  const outerR = 22 * k,innerR = 7 * k,contourR = 14 * k;
  const tailY = 66 * k,tailW = 6 * k;

  return (
    <svg width={s} height={s} viewBox={`0 0 ${s} ${s}`} fill="none" style={{ display: 'block' }}>
      {/* pin teardrop */}
      <g style={animate ? { animation: 'pinDrop 0.8s cubic-bezier(0.34,1.56,0.64,1) both' } : {}}>
        <circle cx={cx} cy={cy} r={outerR} fill={color} />
        <path
          d={`M ${cx - tailW} ${cy + outerR * 0.6}
              Q ${cx - outerR * 0.8} ${cy + outerR * 1.4} ${cx} ${tailY}
              Q ${cx + outerR * 0.8} ${cy + outerR * 1.4} ${cx + tailW} ${cy + outerR * 0.6}
              A ${outerR} ${outerR} 0 0 0 ${cx - tailW} ${cy + outerR * 0.6} Z`}
          fill={color} />
        
        {/* contour arc */}
        <circle
          cx={cx} cy={cy} r={contourR}
          stroke="white" strokeWidth={1.6 * k}
          strokeOpacity="0.35"
          strokeDasharray={`${contourR * Math.PI * 1.4} ${contourR * Math.PI * 0.6}`}
          strokeDashoffset={`${-contourR * Math.PI * 0.15}`}
          strokeLinecap="round"
          fill="none"
          style={{ transformOrigin: `${cx}px ${cy}px` }} />
        
        {/* center dot */}
        <circle cx={cx} cy={cy} r={innerR} fill={dot}
        style={animate ? { transformOrigin: `${cx}px ${cy}px`, animation: 'dotIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.5s both' } : {}} />
        
      </g>
    </svg>);

};

/* ─── animated rippling rings (radar-style) ─────────────── */
const Rings = ({ color }) =>
<>
    {[0, 0.6, 1.2].map((delay, i) =>
  <span key={i} style={{
    position: 'absolute', top: '50%', left: '50%',
    width: 200, height: 200, marginTop: -100, marginLeft: -100,
    borderRadius: '50%', border: `1.5px solid ${color}`,
    animation: `ringRipple 2.4s cubic-bezier(0.4,0,0.2,1) ${delay}s infinite`,
    pointerEvents: 'none'
  }} />
  )}
  </>;


/* ─── topographic background pattern ─────────────────────── */
const TopoBG = ({ color = 'rgba(255,255,255,0.04)' }) =>
<svg width="100%" height="100%" style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}
preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 800">
    <g fill="none" stroke={color} strokeWidth="1">
      {/* organic contour-like curves */}
      <path d="M-50 200 Q100 140 200 180 T450 160" />
      <path d="M-50 240 Q100 180 200 220 T450 200" />
      <path d="M-50 280 Q100 220 200 260 T450 240" />
      <path d="M-50 320 Q100 260 200 300 T450 280" />
      <path d="M-50 360 Q100 300 200 340 T450 320" />
      <path d="M-50 400 Q100 340 200 380 T450 360" />
      <path d="M-50 440 Q100 380 200 420 T450 400" />
      <path d="M-50 480 Q100 420 200 460 T450 440" />
      <path d="M-50 520 Q100 460 200 500 T450 480" />
      <path d="M-50 560 Q100 500 200 540 T450 520" />
      <path d="M-50 600 Q100 540 200 580 T450 560" />
      <path d="M-50 640 Q100 580 200 620 T450 600" />
    </g>
  </svg>;


/* ─── Phone splash (the live screen) ─────────────────────── */
const PhoneSplash = ({ variant, showTagline, animate }) => {
  const isLight = variant === 'light';
  const isBlue = variant === 'blue';
  const bg = isLight ? '#f4f4f0' : isBlue ? T.blue : T.bg;
  const markColor = isBlue ? 'white' : T.blue;
  const dotColor = isBlue ? T.blue : 'white';
  const wordColor = isLight ? '#0d1117' : 'rgba(255,255,255,0.95)';
  const taglineColor = isLight ? 'rgba(13,17,23,0.5)' : isBlue ? 'rgba(255,255,255,0.7)' : T.textMid;
  const ringColor = isLight ? 'rgba(0,83,163,0.20)' : isBlue ? 'rgba(255,255,255,0.30)' : 'rgba(0,83,163,0.40)';
  const topoColor = isLight ? 'rgba(0,83,163,0.06)' : isBlue ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.04)';

  return (
    <div style={{
      width: 390, height: 800,
      background: bg,
      borderRadius: 48,
      overflow: 'hidden',
      position: 'relative',
      boxShadow: '0 50px 140px rgba(0,0,0,0.85), 0 0 0 1.5px rgba(255,255,255,0.09)'
    }}>
      {/* topo lines bg */}
      <TopoBG color={topoColor} />

      {/* status bar */}
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0, height: 36,
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 24px', zIndex: 200
      }}>
        <span style={{ fontSize: 12, fontWeight: 600, color: isLight ? 'rgba(13,17,23,0.7)' : 'rgba(255,255,255,0.7)' }}>10:33</span>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {[3, 4, 5, 6].map((h) =>
          <div key={h} style={{ width: 3, height: h, borderRadius: 1, background: isLight ? 'rgba(13,17,23,0.5)' : 'rgba(255,255,255,0.6)' }} />
          )}
          <div style={{ width: 20, height: 10, borderRadius: 2, border: `1.5px solid ${isLight ? 'rgba(13,17,23,0.4)' : 'rgba(255,255,255,0.5)'}`, marginLeft: 4, padding: 1 }}>
            <div style={{ width: '80%', height: '100%', borderRadius: 1, background: isLight ? 'rgba(13,17,23,0.4)' : 'rgba(255,255,255,0.6)' }} />
          </div>
        </div>
      </div>

      {/* center stack — mark with animated rings */}
      <div style={{
        position: 'absolute', top: '50%', left: 0, right: 0,
        transform: 'translateY(-58%)',
        display: 'flex', flexDirection: 'column', alignItems: 'center',
        gap: 28
      }}>
        <div style={{ position: 'relative', width: 200, height: 200, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          {animate && <Rings color={ringColor} />}
          <Mark size={104} color={markColor} dot={dotColor} animate={animate} />
        </div>

        {/* wordmark */}
        <div style={{
          display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10,
          opacity: 0,
          animation: animate ? 'wordRise 0.7s cubic-bezier(0.16,1,0.3,1) 0.9s forwards' : 'none',
          ...(animate ? {} : { opacity: 1 })
        }}>
          <span style={{
            fontSize: 44, fontWeight: 700, letterSpacing: '-0.04em',
            color: wordColor, lineHeight: 1
          }}>
            Mon<span style={{ fontWeight: 300 }}>Map</span>
          </span>
          {showTagline &&
          <span style={{
            fontSize: 12, fontWeight: 500, color: taglineColor,
            letterSpacing: '0.18em', textTransform: 'uppercase', marginTop: 4
          }}>УЛААНБААТАР

          </span>
          }
        </div>
      </div>

      {/* progress bar at bottom */}
      <div style={{
        position: 'absolute', bottom: 80, left: 64, right: 64,
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12
      }}>
        <div style={{
          width: '100%', height: 2, borderRadius: 2,
          background: isLight ? 'rgba(13,17,23,0.08)' : 'rgba(255,255,255,0.1)',
          overflow: 'hidden', position: 'relative'
        }}>
          <div style={{
            height: '100%', borderRadius: 2,
            background: isBlue ? 'white' : T.blueLite,
            width: animate ? '0%' : '100%',
            animation: animate ? 'barFill 2.4s cubic-bezier(0.65,0,0.35,1) 0.4s forwards' : 'none'
          }} />
        </div>
        <span style={{
          fontSize: 10, fontWeight: 500,
          color: isLight ? 'rgba(13,17,23,0.4)' : isBlue ? 'rgba(255,255,255,0.7)' : T.textLo,
          letterSpacing: '0.12em', textTransform: 'uppercase'
        }}>Газрын зураг ачаалж байна…</span>
      </div>

      {/* footer attribution */}
      <div style={{
        position: 'absolute', bottom: 32, left: 0, right: 0,
        textAlign: 'center'
      }}>
        <p style={{
          fontSize: 10, fontWeight: 500,
          color: isLight ? 'rgba(13,17,23,0.3)' : isBlue ? 'rgba(255,255,255,0.5)' : T.textLo,
          letterSpacing: '0.14em', textTransform: 'uppercase'
        }}>V 1.0 · MONMAP</p>
      </div>

      {/* nav indicator */}
      <div style={{
        position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
        width: 130, height: 5, borderRadius: 3,
        background: isLight ? 'rgba(13,17,23,0.25)' : 'rgba(255,255,255,0.3)'
      }} />
    </div>);

};

/* ─── section label ─────────────────────────────────────── */
const Label = ({ children }) =>
<div style={{
  fontSize: 10, fontWeight: 600, color: 'rgba(255,255,255,0.22)',
  letterSpacing: '0.14em', textTransform: 'uppercase',
  paddingBottom: 12, borderBottom: '1px solid rgba(255,255,255,0.06)',
  marginBottom: 28
}}>{children}</div>;


const PhoneCaption = ({ children }) =>
<p style={{
  fontSize: 12, fontWeight: 500, color: 'rgba(255,255,255,0.4)',
  letterSpacing: '0.06em', textTransform: 'uppercase', textAlign: 'center', marginTop: 16
}}>{children}</p>;


/* ─── App ───────────────────────────────────────────────── */
const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [replayKey, setReplayKey] = React.useState(0);
  if (!tweaks) return null;

  const replay = () => setReplayKey((k) => k + 1);

  return (
    <div style={{ minHeight: '100vh', background: '#080c14', padding: '56px 48px 80px' }}>

      {/* page header */}
      <div style={{ textAlign: 'center', marginBottom: 56 }}>
        <p style={{ fontSize: 11, color: 'rgba(255,255,255,0.25)', letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 10 }}>
          MonMap · Splash дэлгэц
        </p>
        <h1 style={{ fontSize: 13, fontWeight: 500, color: 'rgba(255,255,255,0.45)', letterSpacing: '0.01em' }}>
          App launch screen — animated mark, contour backdrop, Mongolian tagline
        </h1>
      </div>

      <div style={{ maxWidth: 1280, margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 56 }}>

        {/* live preview */}
        <div>
          <Label>Шууд харах · Live Preview</Label>
          <div style={{ display: 'flex', justifyContent: 'center' }}>
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
              <PhoneSplash key={replayKey} variant={tweaks.variant} showTagline={tweaks.showTagline} animate={tweaks.playAnimation} />
              <div style={{ display: 'flex', gap: 12, marginTop: 18 }}>
                <button onClick={replay} style={{
                  padding: '8px 16px', borderRadius: 10,
                  background: 'rgba(255,255,255,0.06)',
                  border: '1px solid rgba(255,255,255,0.1)',
                  color: 'rgba(255,255,255,0.7)',
                  fontSize: 11, fontWeight: 500, letterSpacing: '0.06em',
                  textTransform: 'uppercase', cursor: 'pointer',
                  fontFamily: 'Inter, sans-serif'
                }}>↻ Дахин тоглуулах</button>
              </div>
            </div>
          </div>
        </div>

        {/* three variants side by side */}
        <div>
          <Label>Хувилбарууд · Variants</Label>
          <div style={{ display: 'flex', justifyContent: 'center', gap: 40, flexWrap: 'wrap' }}>
            <div>
              <PhoneSplash variant="dark" showTagline={true} animate={false} />
              <PhoneCaption>Dark · primary</PhoneCaption>
            </div>
            <div>
              <PhoneSplash variant="blue" showTagline={true} animate={false} />
              <PhoneCaption>Blue · brand</PhoneCaption>
            </div>
            <div>
              <PhoneSplash variant="light" showTagline={true} animate={false} />
              <PhoneCaption>Light · alt</PhoneCaption>
            </div>
          </div>
        </div>

      </div>

      {/* tweaks */}
      <TweaksPanel>
        <TweakSection title="Splash">
          <TweakRadio
            id="variant" label="Variant"
            value={tweaks.variant}
            options={[
            { value: 'dark', label: 'Dark' },
            { value: 'blue', label: 'Blue' },
            { value: 'light', label: 'Light' }]
            }
            onChange={(v) => setTweak('variant', v)} />
          
          <TweakToggle id="showTagline" label="Show tagline" value={tweaks.showTagline} onChange={(v) => setTweak('showTagline', v)} />
          <TweakToggle id="playAnimation" label="Animate" value={tweaks.playAnimation} onChange={(v) => setTweak('playAnimation', v)} />
        </TweakSection>
        <TweakSection title="Actions">
          <TweakButton label="Replay animation" onClick={replay} />
        </TweakSection>
      </TweaksPanel>
    </div>);

};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
