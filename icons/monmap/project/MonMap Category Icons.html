<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #080c14; font-family: 'Inter', sans-serif; min-height: 100%; }
  .page { padding: 56px 48px 80px; max-width: 1280px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 56px; }
  .header-logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .header-dot { width: 10px; height: 10px; border-radius: 50%; background: #0053A3; }
  .header-title { font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.92); letter-spacing: -0.03em; }
  .header-sub { font-size: 11px; color: rgba(255,255,255,0.28); letter-spacing: 0.12em; text-transform: uppercase; }
  .group-title { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 18px; }
  .group { margin-bottom: 44px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .card { background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 22px 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; transition: all 0.2s; }
  .card:hover { background: #1a2233; border-color: rgba(255,255,255,0.16); transform: translateY(-2px); }
  .card-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); text-align: center; margin-bottom: 3px; }
  .card-hex { font-size: 9.5px; color: rgba(255,255,255,0.28); font-family: 'Courier New', monospace; }
  .map-strip { background: #e8e0d4; border-radius: 16px; padding: 28px 24px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; justify-content: center; }
</style>
</head>

function makeSVG(key, size, bg) {
  const paths = ICONS[key];
  const pad = size * 0.20;
  const inner = size - pad * 2;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${size/2}" fill="${bg}"/>
    <g transform="translate(${pad},${pad}) scale(${inner/24})">${paths}</g>
  </svg>`;
}

function makeMarker(key, hex) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="42" viewBox="0 0 34 42">
    <circle cx="17" cy="17" r="15" fill="${hex}" stroke="white" stroke-width="2.5"/>
    <g transform="translate(4.5,4.5) scale(0.71)">${ICONS[key]}</g>
    <line x1="17" y1="32" x2="17" y2="40" stroke="${hex}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="17" cy="40.5" r="1.5" fill="${hex}"/>
  </svg>`;
}

const groupsEl = document.getElementById('groups');
const allCats = [];
GROUPS.forEach(g => {
  const wrap = document.createElement('div');
  wrap.className = 'group';
  const title = document.createElement('div');
  title.className = 'group-title';
  title.textContent = g.name;
  wrap.appendChild(title);
  const grid = document.createElement('div');
  grid.className = 'grid';
  g.items.forEach(cat => {
    allCats.push(cat);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div>${makeSVG(cat.key, 60, cat.hex)}</div>
      <div style="text-align:center">
        <div class="card-name">${cat.label}</div>
        <div class="card-hex">${cat.hex}</div>
      </div>
    `;
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  groupsEl.appendChild(wrap);
});

const mapStrip = document.getElementById('mapStrip');
allCats.forEach(cat => {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:6px';
  wrap.innerHTML = `
    ${makeMarker(cat.key, cat.hex)}
    <span style="font-size:9.5px;font-family:Inter,sans-serif;color:#444;text-align:center;max-width:60px;line-height:1.3">${cat.label}</span>
  `;
  mapStrip.appendChild(wrap);
});
</script>
