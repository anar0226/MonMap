<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; connect-src 'self' https://brykoxmygtiyrssmsvys.supabase.co wss://brykoxmygtiyrssmsvys.supabase.co https://brykoxmygtiyrssmsvys.supabase.co/rest/v1/ https://brykoxmygtiyrssmsvys.supabase.co/functions/v1/; img-src 'self' data: blob: https:; font-src 'self' data:; base-uri 'self'; form-action 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Зураглалын хяналт — МонМэп Admin</title>
  <link rel="canonical" href="https://monmap.net/indoor-review.html">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-mark-primary.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background: var(--gray-50, #f9fafb); font-family: var(--font-mn, 'Segoe UI', sans-serif); }
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 1.5rem; font-weight: 800; color: var(--gray-900, #111); margin-bottom: 4px; }
    .sub { font-size: .875rem; color: var(--gray-500, #6b7280); margin-bottom: 24px; }

    /* Filter bar */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .filter-bar select, .filter-bar input {
      padding: 8px 12px; border: 1px solid var(--gray-300, #d1d5db);
      border-radius: 8px; font-size: .875rem;
    }

    /* Session cards */
    .session-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .session-card {
      background: #fff; border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 18px; cursor: pointer; transition: box-shadow .15s;
      border-left: 4px solid transparent;
    }
    .session-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); }
    .session-card.submitted { border-left-color: #f59e0b; }
    .session-card.approved  { border-left-color: #16a34a; }
    .session-card.rejected  { border-left-color: #ef4444; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .card-venue { font-weight: 700; font-size: .95rem; color: var(--gray-900, #111); }
    .badge {
      font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    }
    .badge-submitted { background: #fef3c7; color: #92400e; }
    .badge-approved  { background: #dcfce7; color: #166534; }
    .badge-rejected  { background: #fee2e2; color: #991b1b; }
    .card-meta { font-size: .8rem; color: var(--gray-500, #6b7280); margin-bottom: 2px; }
    .card-counts { font-size: .8rem; color: var(--gray-700, #374151); margin-top: 8px; }

    /* Modal */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 900;
      align-items: flex-start; justify-content: center;
      padding: 40px 16px; overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff; border-radius: 16px; width: 100%; max-width: 780px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      padding: 20px 24px 16px; border-bottom: 1px solid var(--gray-200, #e5e7eb);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h2 { font-size: 1.1rem; font-weight: 700; }
    .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--gray-500); }
    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    #review-map { height: 320px; border-radius: 10px; overflow: hidden; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .info-item { background: var(--gray-50, #f9fafb); border-radius: 8px; padding: 10px 14px; }
    .info-item .label { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--gray-400, #9ca3af); }
    .info-item .value { font-size: .95rem; font-weight: 700; color: var(--gray-900, #111); margin-top: 2px; }
    .form-row { display: flex; flex-direction: column; gap: 4px; }
    .form-row label { font-size: .8rem; font-weight: 600; color: var(--gray-600, #4b5563); }
    .form-row input, .form-row textarea {
      padding: 9px 12px; border: 1px solid var(--gray-300, #d1d5db);
      border-radius: 8px; font-size: .875rem; font-family: inherit;
    }
    .modal-footer {
      padding: 16px 24px; border-top: 1px solid var(--gray-200, #e5e7eb);
      display: flex; gap: 10px; justify-content: flex-end;
    }
    .btn { padding: 10px 20px; border-radius: 9px; font-size: .875rem; font-weight: 600; border: none; cursor: pointer; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-approve { background: #16a34a; color: #fff; }
    .btn-reject  { background: #ef4444; color: #fff; }
    .btn-cancel  { background: var(--gray-200, #e5e7eb); color: var(--gray-800, #1f2937); }

    #empty-state { text-align: center; padding: 60px 24px; color: var(--gray-400, #9ca3af); font-size: 1rem; }
  </style>
</head>
<body>
<div class="page-wrap">
  <h1>Зураглалын хяналт</h1>
  <p class="sub">Mappers-уудын илгээсэн floor mapping session-уудыг батлах эсвэл татгалзах.</p>

  <div class="filter-bar">
    <select id="filter-status">
      <option value="submitted">Хүлээгдэж буй</option>
      <option value="approved">Батлагдсан</option>
      <option value="rejected">Татгалзсан</option>
    </select>
    <input type="text" id="filter-venue" placeholder="Venue хайх..." style="min-width:180px" />
    <span id="count-label" style="font-size:.85rem;color:var(--gray-500)"></span>
  </div>

  <div class="session-grid" id="session-grid">
    <div id="empty-state">Уншиж байна...</div>
  </div>
</div>

<!-- Review Modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Session хянах</h2>
      <button class="modal-close" id="modal-close-btn">✕</button>
    </div>
    <div class="modal-body">
      <div id="review-map"></div>
      <div class="info-grid">
        <div class="info-item"><div class="label">Venue</div><div class="value" id="info-venue">—</div></div>
        <div class="info-item"><div class="label">Давхар</div><div class="value" id="info-floor">—</div></div>
        <div class="info-item"><div class="label">Mapper</div><div class="value" id="info-mapper">—</div></div>
        <div class="info-item"><div class="label">Nodes / Edges</div><div class="value" id="info-counts">—</div></div>
        <div class="info-item"><div class="label">Илгээсэн</div><div class="value" id="info-submitted">—</div></div>
        <div class="info-item"><div class="label">Төлөв</div><div class="value" id="info-status">—</div></div>
      </div>
      <div class="form-row" id="row-reward">
        <label>Урамшуулал (MNT)</label>
        <input type="number" id="input-reward" min="1000" step="500" placeholder="5000" />
      </div>
      <div class="form-row">
        <label>Тайлбар (optional)</label>
        <textarea id="input-notes" rows="2" placeholder="Хянагчийн тайлбар..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" id="btn-cancel">Болих</button>
      <button class="btn btn-reject"  id="btn-reject">Татгалзах</button>
      <button class="btn btn-approve" id="btn-approve">Батлах</button>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/supabase-client.js"></script>
<script>
const SUPABASE_URL = 'https://brykoxmygtiyrssmsvys.supabase.co'
let sessions    = []
let activeSession = null
let reviewMap   = null
let authToken   = null

async function waitForSupabase() {
  while (!window._sb) await new Promise(r => setTimeout(r, 50))
}

document.addEventListener('DOMContentLoaded', async () => {
  await waitForSupabase()
  const { data: { session } } = await window._sb.auth.getSession()
  if (!session) { window.location.href = 'login.html'; return }
  authToken = session.access_token
  loadSessions()
})

document.getElementById('filter-status').addEventListener('change', loadSessions)
document.getElementById('filter-venue').addEventListener('input', () => {
  clearTimeout(document.getElementById('filter-venue')._t)
  document.getElementById('filter-venue')._t = setTimeout(loadSessions, 300)
})

async function loadSessions() {
  const status = document.getElementById('filter-status').value
  const venueQ = document.getElementById('filter-venue').value.trim()

  let query = window._sb
    .from('mapping_sessions')
    .select(`
      id, status, floor_number, nodes_added, edges_added, reward_mnt,
      started_at, ended_at, reviewer_notes, reviewed_at,
      venue_mappers!inner(
        user_id,
        venues!inner(id, name_mn)
      )
    `)
    .eq('status', status)
    .order('ended_at', { ascending: false })
    .limit(50)

  if (venueQ) {
    query = query.ilike('venue_mappers.venues.name_mn', `%${venueQ}%`)
  }

  const { data, error } = await query
  sessions = data ?? []
  document.getElementById('count-label').textContent = `${sessions.length} session`
  renderGrid()
}

function renderGrid() {
  const grid = document.getElementById('session-grid')
  if (!sessions.length) {
    grid.innerHTML = '<div id="empty-state">Session олдсонгүй</div>'
    return
  }

  grid.innerHTML = sessions.map(s => {
    const mapper = s.venue_mappers
    const venue  = mapper?.venues
    const dt     = s.ended_at ? new Date(s.ended_at).toLocaleString('mn-MN') : '—'
    const badgeClass = { submitted: 'badge-submitted', approved: 'badge-approved', rejected: 'badge-rejected' }[s.status] ?? 'badge-submitted'
    const statusMn   = { submitted: 'Хүлээгдэж буй', approved: 'Батлагдсан', rejected: 'Татгалзсан' }[s.status] ?? s.status

    return `
      <div class="session-card ${escapeHtml(s.status)}" onclick="openModal('${escapeHtml(s.id)}')">
        <div class="card-header">
          <div class="card-venue">${escapeHtml(venue?.name_mn ?? '—')}</div>
          <span class="badge ${escapeHtml(badgeClass)}">${escapeHtml(statusMn)}</span>
        </div>
        <div class="card-meta">Давхар ${escapeHtml(String(s.floor_number))}</div>
        <div class="card-meta">Илгээсэн: ${escapeHtml(dt)}</div>
        <div class="card-counts">${escapeHtml(String(s.nodes_added ?? 0))} nodes · ${escapeHtml(String(s.edges_added ?? 0))} edges${s.reward_mnt ? ' · ' + escapeHtml(String(s.reward_mnt)) + ' ₮' : ''}</div>
      </div>`
  }).join('')
}

// ─── Modal ─────────────────────────────────────────────────────────────────────
async function openModal(sessionId) {
  activeSession = sessions.find(s => s.id === sessionId)
  if (!activeSession) return

  const mapper = activeSession.venue_mappers
  const venue  = mapper?.venues

  document.getElementById('modal-title').textContent = `Session: ${venue?.name_mn ?? '—'} — ${activeSession.floor_number}-р давхар`
  document.getElementById('info-venue').textContent   = venue?.name_mn ?? '—'
  document.getElementById('info-floor').textContent   = activeSession.floor_number + '-р давхар'
  document.getElementById('info-mapper').textContent  = mapper?.user_id?.slice(0, 8) + '...'
  document.getElementById('info-counts').textContent  = `${activeSession.nodes_added} / ${activeSession.edges_added}`
  document.getElementById('info-submitted').textContent = activeSession.ended_at
    ? new Date(activeSession.ended_at).toLocaleString('mn-MN') : '—'
  document.getElementById('info-status').textContent  = activeSession.status

  const isReviewable = activeSession.status === 'submitted'
  document.getElementById('btn-approve').disabled = !isReviewable
  document.getElementById('btn-reject').disabled  = !isReviewable
  document.getElementById('row-reward').style.display = isReviewable ? 'block' : 'none'
  document.getElementById('input-notes').value    = activeSession.reviewer_notes ?? ''
  document.getElementById('input-reward').value   = activeSession.reward_mnt || 5000

  document.getElementById('modal').classList.add('open')
  await loadReviewMap(venue?.id, activeSession.floor_number)
}

async function loadReviewMap(venueId, floorNumber) {
  if (!reviewMap) {
    reviewMap = L.map('review-map', { zoomControl: true })
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 22,
    }).addTo(reviewMap)
  } else {
    // Clear previous layers
    reviewMap.eachLayer(l => { if (!(l instanceof L.TileLayer)) reviewMap.removeLayer(l) })
  }

  if (!venueId) return

  // Load nodes for this venue + floor
  const { data: nodes } = await window._sb
    .from('indoor_nodes')
    .select('id, node_type, lat, lng, label_mn')
    .eq('venue_id', venueId)
    .eq('floor_number', floorNumber)

  const { data: edges } = await window._sb
    .from('indoor_edges')
    .select('from_node_id, to_node_id')
    .eq('venue_id', venueId)

  if (!nodes?.length) {
    showToast('Node олдсонгүй — session дөнгөж илгээгдсэн байж болно')
    return
  }

  const nodeMap = new Map(nodes.map(n => [n.id, n]))
  const bounds  = []

  const COLORS = {
    path: '#6b7280', junction: '#d97706', store: '#2563eb',
    elevator: '#7c3aed', escalator: '#7c3aed', stairs: '#7c3aed',
    entrance: '#16a34a', restroom: '#0891b2', info: '#ea580c',
  }

  for (const n of nodes) {
    bounds.push([n.lat, n.lng])
    const color = COLORS[n.node_type] ?? '#6b7280'
    L.circleMarker([n.lat, n.lng], { radius: 7, color, fillColor: color, fillOpacity: .85, weight: 2 })
      .bindTooltip(escapeHtml(n.label_mn ?? n.node_type), { permanent: false, direction: 'top' })
      .addTo(reviewMap)
  }

  for (const e of (edges ?? [])) {
    const a = nodeMap.get(e.from_node_id)
    const b = nodeMap.get(e.to_node_id)
    if (a && b) {
      L.polyline([[a.lat, a.lng], [b.lat, b.lng]], {
        color: '#2563eb', weight: 2.5, opacity: .6, dashArray: '5,4',
      }).addTo(reviewMap)
    }
  }

  if (bounds.length) {
    reviewMap.fitBounds(bounds, { padding: [24, 24] })
    setTimeout(() => reviewMap.invalidateSize(), 50)
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('open')
  activeSession = null
}

document.getElementById('modal-close-btn').addEventListener('click', closeModal)
document.getElementById('btn-cancel').addEventListener('click', closeModal)
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal() })

document.getElementById('btn-approve').addEventListener('click', async () => {
  if (!activeSession) return
  const rewardMnt = parseInt(document.getElementById('input-reward').value, 10)
  if (!rewardMnt || rewardMnt < 500) { showToast('Урамшуулалын дүн оруулна уу'); return }
  await submitReview('approve', rewardMnt)
})

document.getElementById('btn-reject').addEventListener('click', async () => {
  if (!activeSession) return
  if (!confirm('Татгалзах уу?')) return
  await submitReview('reject', null)
})

async function submitReview(action, rewardMnt) {
  const notes = document.getElementById('input-notes').value.trim() || null
  document.getElementById('btn-approve').disabled = true
  document.getElementById('btn-reject').disabled  = true

  const body = { sessionId: activeSession.id, action, reviewerNotes: notes }
  if (action === 'approve') body.rewardMnt = rewardMnt

  const res = await fetch(`${SUPABASE_URL}/functions/v1/indoor-mapping-approve`, {
    method:  'POST',
    headers: { Authorization: `Bearer ${authToken}`, 'Content-Type': 'application/json' },
    body:    JSON.stringify(body),
  })
  const json = await res.json()

  if (!res.ok) {
    showToast('Алдаа: ' + (json.error ?? res.status))
    document.getElementById('btn-approve').disabled = false
    document.getElementById('btn-reject').disabled  = false
    return
  }

  showToast(action === 'approve'
    ? `Батлагдлаа! ${rewardMnt?.toLocaleString()} ₮ mapper-д шилжлээ.`
    : 'Татгалзсан.')
  closeModal()
  loadSessions()
}

function showToast(msg, ms = 3500) {
  const existing = document.getElementById('_toast')
  const el = existing ?? Object.assign(document.createElement('div'), {
    id: '_toast',
    style: 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:20px;font-size:.85rem;z-index:9999;max-width:calc(100vw - 32px);text-align:center;',
  })
  if (!existing) document.body.appendChild(el)
  el.textContent = msg; el.style.display = 'block'
  clearTimeout(el._t)
  el._t = setTimeout(() => { el.style.display = 'none' }, ms)
}
</script>
</body>
</html>
