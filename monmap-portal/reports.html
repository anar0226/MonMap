  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── KPI grid ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }
    .kpi-card {
      background: var(--white); border: 1px solid var(--gray-200);
      border-radius: 12px; padding: 14px 16px;
    }
    .kpi-label {
      font-size: 0.6875rem; font-weight: 700; color: var(--gray-400);
      letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px;
    }
    .kpi-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .kpi-value {
      font-size: 1.25rem; font-weight: 700; color: var(--gray-900);
      letter-spacing: -.02em; line-height: 1.1; white-space: nowrap;
    }
    .kpi-delta {
      font-size: 0.6875rem; font-weight: 600; padding: 2px 7px;
      border-radius: 5px; white-space: nowrap;
    }
    .kpi-delta.up   { color: #059669; background: #ECFDF5; }
    .kpi-delta.down { color: #DC2626; background: #FEF2F2; }

    /* ── Date range bar ── */
    .date-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .date-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; background: var(--white);
      border: 1px solid var(--gray-200); border-radius: 8px;
      font-size: 0.78125rem; font-weight: 500; color: var(--gray-800);
      cursor: pointer; font-family: inherit;
    }
    .date-btn:hover { background: var(--gray-50); }
    .date-btn .caret { color: var(--gray-400); font-size: 0.6875rem; }

    /* ── Tab strip ── */
    .rpt-tab-strip {
      display: flex; gap: 0; border-bottom: 1px solid var(--gray-200); margin-bottom: 18px;
    }
    .rpt-tab-btn {
      padding: 11px 16px; background: transparent; border: none;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      font-size: 0.8125rem; font-weight: 500; color: var(--gray-400);
      cursor: pointer; font-family: inherit; transition: color .12s;
    }
    .rpt-tab-btn.active { font-weight: 600; color: var(--primary); border-bottom-color: var(--primary); }

    /* ── Report grid ── */
    .rpt-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
    .rpt-card {
      background: var(--white); border: 1px solid var(--gray-200);
      border-radius: 12px; padding: 18px;
    }
    .rpt-card.span-full { grid-column: 1 / -1; }
    .rpt-card-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 14px;
    }
    .rpt-card-title { font-size: 0.875rem; font-weight: 600; color: var(--gray-900); }
    .rpt-card-sub { font-size: 0.71875rem; color: var(--gray-400); margin-top: 2px; }

    /* ── Legend ── */
    .legend { display: flex; gap: 14px; font-size: 0.6875rem; color: var(--gray-400); flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-line { width: 10px; height: 2px; border-radius: 1px; }
    .legend-dash { width: 10px; height: 0; border-top: 2px dashed; }

    /* ── Bar / progress rows ── */
    .prog-row { margin-bottom: 12px; }
    .prog-row:last-child { margin-bottom: 0; }
    .prog-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.75rem; }
    .prog-label { font-weight: 500; color: var(--gray-800); }
    .prog-val { color: var(--gray-400); }
    .prog-track { height: 6px; border-radius: 3px; background: var(--gray-100); overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 3px; }

    /* ── Data table ── */
    .rpt-table-head {
      display: grid; padding: 8px 0;
      border-bottom: 1px solid var(--gray-200);
      font-size: 0.65625rem; font-weight: 700; color: var(--gray-400);
      letter-spacing: .06em; text-transform: uppercase; gap: 12px;
    }
    .rpt-table-row {
      display: grid; padding: 11px 0;
      border-bottom: 1px solid var(--gray-100);
      align-items: center; font-size: 0.78125rem; gap: 12px;
    }
    .rpt-table-row:last-child { border-bottom: none; }
    .cell-r { text-align: right; }
    .cell-brand { text-align: right; font-weight: 600; color: var(--primary); }

    /* ── Avatar ── */
    .mini-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6875rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .sm-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65625rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }

    /* ── Funnel / status strips ── */
    .status-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
    }
    .status-cell {
      padding: 14px 18px; border-right: 1px solid var(--gray-200);
    }
    .status-cell:last-child { border-right: none; }
    .status-cell-label {
      font-size: 0.6875rem; font-weight: 700; color: var(--gray-400);
      letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px;
    }
    .status-num { font-size: 1.375rem; font-weight: 700; color: var(--gray-900); letter-spacing: -.02em; }
    .status-pct { font-size: 0.75rem; font-weight: 600; margin-left: 6px; }

    /* ── Util bar ── */
    .util-bar { display: flex; align-items: center; gap: 8px; }
    .util-track { flex: 1; height: 5px; border-radius: 3px; background: var(--gray-100); overflow: hidden; }
    .util-fill { height: 100%; border-radius: 3px; }
    .util-pct { font-size: 0.71875rem; font-weight: 600; color: var(--gray-900); min-width: 32px; text-align: right; }

    /* ── Reviews ── */
    .review-row {
      display: flex; gap: 14px; padding: 12px 0;
      border-bottom: 1px solid var(--gray-100);
    }
    .review-row:last-child { border-bottom: none; }
    .review-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--gray-100); color: var(--gray-800);
      font-size: 0.75rem; font-weight: 600;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .review-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
    .review-name { font-size: 0.78125rem; font-weight: 600; }
    .review-stars { font-size: 0.75rem; color: #F59E0B; }
    .review-svc { font-size: 0.6875rem; color: var(--gray-400); }
    .review-when { font-size: 0.6875rem; color: var(--gray-400); margin-left: auto; }
    .review-text { font-size: 0.78125rem; color: var(--gray-800); line-height: 1.5; }

    /* ── Empty state ── */
    .rpt-tab-panel { display: none; }
    .rpt-tab-panel.active { display: block; }
  </style>
</head>

<script>
// ── State ─────────────────────────────────────────────────────────
let _placeId = null;
let _rptData = null;   // built by buildRptData()

const SVC_COLORS = ['#0053A3','#EC4899','#10B981','#6366F1','#F59E0B','#EF4444','#8B5CF6','#14B8A6'];
const PRIMARY = '#1a56db';

// ── Helpers ───────────────────────────────────────────────────────
function fmtMoney(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1) + ' сая₮';
  if (n >= 1e3) return Math.round(n/1e3) + ' мян₮';
  return n + '₮';
}
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad2(n) { return String(n).padStart(2,'0'); }
function emptyStateHtml(icon, title, sub) {
  return `<div style="padding:48px 24px;text-align:center;">
    <div style="font-size:2.5rem;margin-bottom:12px;">${icon}</div>
    <div style="font-size:.9375rem;font-weight:700;color:var(--gray-800);margin-bottom:6px;">${title}</div>
    <div style="font-size:.8125rem;color:var(--gray-400);max-width:360px;margin:0 auto;line-height:1.55;">${sub}</div>
  </div>`;
}

// ── SVG chart helpers ─────────────────────────────────────────────
function buildSparkSvg(data, color, w=120, h=36) {
  if (!data || data.length < 2) return '';
  const max = Math.max(...data), min = Math.min(...data);
  const span = max - min || 1;
  const pts = data.map((d, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((d - min) / span) * h * 0.85 - h * 0.1;
    return x + ',' + y;
  }).join(' ');
  const area = '0,' + h + ' ' + pts + ' ' + w + ',' + h;
  return `<svg width="${w}" height="${h}" style="display:block">
    <polygon points="${area}" fill="${color}" fill-opacity="0.08"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function buildLineChart(series, labels, h=240, formatY=null) {
  const allVals = series.flatMap(s => s.data);
  const max = Math.max(...allVals) * 1.1 || 1;
  const W=760, padL=44, padR=8, padT=8, padB=26;
  const innerW = W-padL-padR, innerH = h-padT-padB;
  const xN = labels.length;
  const yTicks = 4;

  const xy = (i, v) => [
    padL + (i / Math.max(xN - 1, 1)) * innerW,
    padT + innerH - (v / max) * innerH,
  ];

  let svg = `<svg viewBox="0 0 ${W} ${h}" width="100%" style="display:block">`;

  // y grid + labels
  for (let i = 0; i <= yTicks; i++) {
    const y = padT + (i / yTicks) * innerH;
    const v = max * (1 - i / yTicks);
    const label = formatY ? formatY(v) : Math.round(v).toLocaleString('mn-MN');
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#F3F4F6" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+4}" font-size="10" fill="#94a3b8" text-anchor="end">${label}</text>`;
  }
  // x labels
  labels.forEach((lab, i) => {
    const show = xN <= 12 || i % Math.ceil(xN / 8) === 0;
    if (!show) return;
    const [x] = xy(i, 0);
    svg += `<text x="${x}" y="${h-6}" font-size="10" fill="#94a3b8" text-anchor="middle">${lab}</text>`;
  });
  // series
  series.forEach((s, si) => {
    const pts = s.data.map((v, i) => xy(i, v).join(',')).join(' ');
    const [x0] = xy(0, 0); const [xN1] = xy(s.data.length-1, 0);
    const area = `${x0},${padT+innerH} ${pts} ${xN1},${padT+innerH}`;
    if (si === 0) svg += `<polygon points="${area}" fill="${s.color}" fill-opacity="0.1"/>`;
    const dash = s.dashed ? ' stroke-dasharray="4 4"' : '';
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${si===0?2:1.5}" stroke-linecap="round" stroke-linejoin="round"${dash}/>`;
    if (si === 0) {
      s.data.forEach((v, i) => {
        const [x, y] = xy(i, v);
        svg += `<circle cx="${x}" cy="${y}" r="2.5" fill="#fff" stroke="${s.color}" stroke-width="1.5"/>`;
      });
    }
  });
  svg += '</svg>';
  return svg;
}

function legendHtml(items) {
  return '<div class="legend">' + items.map(it => {
    const lineEl = it.dashed
      ? `<span class="legend-dash" style="border-color:${it.color};width:10px"></span>`
      : `<span class="legend-line" style="background:${it.color}"></span>`;
    return `<span class="legend-item">${lineEl}<span>${it.label}</span></span>`;
  }).join('') + '</div>';
}

function cardHtml({ title, sub='', right='', children, spanFull=false }) {
  return `<section class="rpt-card${spanFull?' span-full':''}">
    <div class="rpt-card-head">
      <div>
        <div class="rpt-card-title">${title}</div>
        ${sub ? `<div class="rpt-card-sub">${sub}</div>` : ''}
      </div>
      ${right}
    </div>
    ${children}
  </section>`;
}

function progRowHtml(label, valLabel, pct, color) {
  return `<div class="prog-row">
    <div class="prog-header"><span class="prog-label">${escHtml(label)}</span><span class="prog-val">${escHtml(String(valLabel))}</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}

// ── Aggregate real data from Supabase rows ────────────────────────
function buildRptData(bookings, services, reviews, y, mo) {
  const daysInMonth = new Date(y, mo + 1, 0).getDate();
  const dayLabels   = Array.from({ length: daysInMonth }, (_, i) => String(i + 1));

  // Service price lookup
  const priceMap = {};
  (services || []).forEach(s => { if (s.name) priceMap[s.name] = s.price || 0; });

  // Build daily arrays
  const bkgByDay = new Array(daysInMonth).fill(0);
  const revByDay = new Array(daysInMonth).fill(0);
  (bookings || []).forEach(b => {
    const d = parseInt((b.booked_date || '').split('-')[2] || '0', 10) - 1;
    if (d < 0 || d >= daysInMonth) return;
    bkgByDay[d]++;
    if ((b.status === 'confirmed' || b.status === 'completed') && b.service && priceMap[b.service]) {
      revByDay[d] += priceMap[b.service];
    }
  });

  // Service breakdown
  const svcMap = {};
  (bookings || []).forEach(b => {
    if (!b.service) return;
    if (!svcMap[b.service]) {
      svcMap[b.service] = { bookings: 0, revenue: 0, color: SVC_COLORS[Object.keys(svcMap).length % SVC_COLORS.length] };
    }
    svcMap[b.service].bookings++;
    const price = priceMap[b.service] || 0;
    if ((b.status === 'confirmed' || b.status === 'completed') && price) {
      svcMap[b.service].revenue += price;
    }
  });
  const svcStats = Object.entries(svcMap)
    .sort((a, b) => b[1].revenue - a[1].revenue || b[1].bookings - a[1].bookings)
    .slice(0, 8);

  // Status counts
  const total     = (bookings || []).length;
  const confirmed = (bookings || []).filter(b => b.status === 'confirmed' || b.status === 'completed').length;
  const cancelled = (bookings || []).filter(b => b.status === 'cancelled' || b.status === 'canceled').length;
  const noshow    = (bookings || []).filter(b => b.status === 'noshow').length;
  const pending   = (bookings || []).filter(b => b.status === 'pending').length;

  const totalRev = revByDay.reduce((a, v) => a + v, 0);
  const hasRev   = totalRev > 0;

  // Guest stats
  const phoneSeen = {};
  (bookings || []).forEach(b => {
    const key = b.guest_phone || b.guest_name;
    if (key) phoneSeen[key] = (phoneSeen[key] || 0) + 1;
  });
  const uniqueGuests    = Object.keys(phoneSeen).length;
  const returningGuests = Object.values(phoneSeen).filter(c => c > 1).length;
  const newGuests       = uniqueGuests - returningGuests;

  const avgRating = (reviews || []).length
    ? ((reviews || []).reduce((a, r) => a + (r.rating || 0), 0) / reviews.length).toFixed(1)
    : null;

  return {
    bookings: bookings || [], services: services || [], reviews: reviews || [],
    dayLabels, bkgByDay, revByDay, svcStats,
    total, confirmed, cancelled, noshow, pending,
    totalRev, hasRev, uniqueGuests, returningGuests, newGuests, avgRating,
  };
}

// ── Init ──────────────────────────────────────────────────────────
(async () => {
  const auth = await requireAuth();
  if (!auth) return;
  const { biz } = auth;

  if (biz) {
    _placeId = biz.id;
    document.getElementById('sbBizName').textContent = biz.name;
    document.getElementById('sbBizType').textContent  = biz.type || 'МонМэп Бизнес';
    const init = (biz.name || 'М')[0].toUpperCase();
    document.getElementById('sbAvatar').textContent  = init;
    document.getElementById('topAvatar').textContent = init;
  }

  if (!biz) { renderNoBizState(); return; }

  // Pending sidebar badge
  const { count: pendingCount } = await _sb.from('bookings')
    .select('id', { count:'exact', head:true })
    .eq('place_id', _placeId).eq('status', 'pending');
  const badge = document.getElementById('pendingBadge');
  if (pendingCount > 0) { badge.textContent = pendingCount; badge.style.display = 'inline-flex'; }

  wireThemeToggle('#themeToggle');
  loadNotifBadge();
  startNotifBadgePolling();

  // Date range for current month
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth();
  const from = `${y}-${pad2(mo + 1)}-01`;
  const to   = new Date(y, mo + 1, 0).toISOString().split('T')[0];

  const MONTHS_MN = ['1-р сар','2-р сар','3-р сар','4-р сар','5-р сар','6-р сар',
                     '7-р сар','8-р сар','9-р сар','10-р сар','11-р сар','12-р сар'];
  const daysInMonth = new Date(y, mo + 1, 0).getDate();
  document.getElementById('dateRangeLabel').textContent = `01 — ${daysInMonth} ${MONTHS_MN[mo]}, ${y}`;

  // Fetch all data in parallel
  const [{ data: bookings }, { data: svcRows }, { data: reviewRows }] = await Promise.all([
    _sb.from('bookings')
       .select('id, booked_date, service, status, guest_phone, guest_name, created_at')
       .eq('place_id', _placeId)
       .gte('booked_date', from)
       .lte('booked_date', to),
    _sb.from('services')
       .select('name, price, is_active')
       .eq('place_id', _placeId),
    _sb.from('reviews')
       .select('id, rating, comment, created_at')
       .eq('place_id', _placeId)
       .order('created_at', { ascending: false })
       .limit(5),
  ]);

  _rptData = buildRptData(bookings, svcRows, reviewRows, y, mo);

  renderKpis();
  renderTab('revenue');
})();

// Empty state shown when the signed-in user has no business registered yet.
// Mirrors customers.html / bookings.html so the CTA copy stays consistent.
function renderNoBizState() {
  document.querySelector('.date-bar').style.display = 'none';
  document.querySelector('.rpt-tab-strip').style.display = 'none';
  ['rpt-tab-revenue','rpt-tab-bookings','rpt-tab-staff','rpt-tab-customers','rpt-tab-marketing']
    .forEach(id => { const el = document.getElementById(id); if (el) { el.classList.remove('active'); el.style.display = 'none'; } });
  document.getElementById('kpiGrid').innerHTML = `
    <div style="grid-column:1/-1;background:var(--white);border:1px solid var(--gray-200);border-radius:12px;padding:56px 24px;text-align:center;">
      <div style="font-size:2.75rem;margin-bottom:14px;">🏪</div>
      <h3 style="margin:0 0 8px;font-size:1.0625rem;font-weight:700;color:var(--gray-900);">Бизнес бүртгэгдээгүй байна</h3>
      <p style="margin:8px auto 16px;font-size:0.875rem;color:var(--gray-500);max-width:440px;line-height:1.55;">Тайлан үзэхийн тулд эхлээд бизнесээ бүртгүүлнэ үү.</p>
      <a href="register.html" class="btn btn-primary btn-sm">Бизнес бүртгүүлэх →</a>
    </div>`;
}

// ── KPI cards ─────────────────────────────────────────────────────
function renderKpis() {
  const d = _rptData;
  if (!d) return;

  const kpis = [
    { label:'Орлого',     value: d.hasRev ? fmtMoney(d.totalRev) : '—',  color: PRIMARY,    spark: d.revByDay },
    { label:'Захиалга',   value: String(d.total),                          color: PRIMARY,    spark: d.bkgByDay },
    { label:'Харилцагч',  value: String(d.uniqueGuests),                   color: '#10B981',  spark: d.bkgByDay },
    { label:'Ирээгүй',    value: d.total > 0 ? ((d.noshow/d.total)*100).toFixed(1)+'%' : '0%', color:'#F59E0B', spark: d.bkgByDay.map(v => v > 0 ? 1 : 0) },
    { label:'Дундаж үнэлгээ', value: d.avgRating ? d.avgRating+' / 5' : '—', color:'#EC4899', spark: d.reviews.map(r => r.rating||0).reverse() },
  ];

  document.getElementById('kpiGrid').innerHTML = kpis.map(k => {
    const spark = buildSparkSvg(k.spark, k.color);
    return `<div class="kpi-card">
      <div class="kpi-label">${escHtml(k.label)}</div>
      <div class="kpi-row"><div class="kpi-value">${escHtml(k.value)}</div></div>
      ${spark}
    </div>`;
  }).join('');
}

// ── Tab switching ─────────────────────────────────────────────────
function switchRptTab(id) {
  document.querySelectorAll('.rpt-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.rpt-tab-panel').forEach(p => p.classList.toggle('active', p.id === 'rpt-tab-' + id));
  renderTab(id);
}

const _rendered = {};
function renderTab(id) {
  if (_rendered[id]) return;
  _rendered[id] = true;
  switch (id) {
    case 'revenue':   renderRevenue();   break;
    case 'bookings':  renderBookings();  break;
    case 'staff':     renderStaff();     break;
    case 'customers': renderCustomers(); break;
    case 'marketing': renderMarketing(); break;
  }
}

// ── Revenue tab ───────────────────────────────────────────────────
function renderRevenue() {
  const d = _rptData;
  if (!d || d.total === 0) {
    document.getElementById('rpt-tab-revenue').innerHTML =
      cardHtml({ spanFull: true, title: 'Орлого', children: emptyStateHtml('📊', 'Захиалга байхгүй байна', 'Орлогын тайлан үүсгэхийн тулд захиалга хүлээн авах шаардлагатай.') });
    return;
  }

  const MONTHS = ['1-р','2-р','3-р','4-р','5-р','6-р','7-р','8-р','9-р','10-р','11-р','12-р'];
  const curMonth = MONTHS[new Date().getMonth()];
  const totalSvcRev = d.svcStats.reduce((a, [, s]) => a + s.revenue, 0);
  const totalSvcBkg = d.svcStats.reduce((a, [, s]) => a + s.bookings, 0);
  const useRev = totalSvcRev > 0;

  const byServiceHtml = d.svcStats.length
    ? d.svcStats.map(([name, s], i) => {
        const color = SVC_COLORS[i % SVC_COLORS.length];
        const pct = useRev
          ? (totalSvcRev > 0 ? (s.revenue / totalSvcRev) * 100 : 0)
          : (totalSvcBkg > 0 ? (s.bookings / totalSvcBkg) * 100 : 0);
        return progRowHtml(name, useRev ? fmtMoney(s.revenue) : s.bookings + ' захиалга', pct, color);
      }).join('')
    : '<div style="color:var(--gray-400);font-size:.875rem;padding:12px 0;">Үйлчилгээний мэдээлэл байхгүй байна.</div>';

  const chartSeries = useRev
    ? [{ color: PRIMARY, data: d.revByDay }]
    : [{ color: PRIMARY, data: d.bkgByDay }];
  const chartFmt = useRev
    ? (v => v >= 1e6 ? (v/1e6).toFixed(1)+'м' : (v/1e3).toFixed(0)+'к')
    : null;

  document.getElementById('rpt-tab-revenue').innerHTML = `<div class="rpt-grid">
    ${cardHtml({
      title: (useRev ? 'Орлого ' : 'Захиалга ') + curMonth + ' сард',
      sub: 'Өдрөөр',
      right: legendHtml([{ color: PRIMARY, label: useRev ? 'Орлого' : 'Захиалга' }]),
      children: buildLineChart(chartSeries, d.dayLabels, 240, chartFmt),
    })}
    ${cardHtml({
      title: 'Үйлчилгээгээр',
      sub: useRev ? 'Орлогын эзлэх хувь' : 'Захиалгын эзлэх хувь',
      children: byServiceHtml,
    })}
  </div>`;
}

// ── Bookings tab ──────────────────────────────────────────────────
function renderBookings() {
  const d = _rptData;
  if (!d || d.total === 0) {
    document.getElementById('rpt-tab-bookings').innerHTML =
      cardHtml({ spanFull: true, title: 'Захиалга', children: emptyStateHtml('📅', 'Захиалга байхгүй байна', 'Энэ сард захиалга байхгүй байна.') });
    return;
  }

  const denom = d.confirmed + d.cancelled + d.noshow || 1;
  const statuses = [
    { label:'Баталгаажсан',  n: d.confirmed, pct: Math.round(d.confirmed / denom * 100), color:'#10B981' },
    { label:'Цуцалсан',      n: d.cancelled, pct: Math.round(d.cancelled  / denom * 100), color:'#9CA3AF' },
    { label:'Ирээгүй',       n: d.noshow,    pct: Math.round(d.noshow     / denom * 100), color:'#F59E0B' },
    { label:'Хүлээгдэж буй', n: d.pending,   pct: '—', color: PRIMARY },
  ];

  document.getElementById('rpt-tab-bookings').innerHTML = `<div class="rpt-grid">
    ${cardHtml({
      title: 'Захиалга өдрөөр',
      right: legendHtml([{ color: PRIMARY, label: 'Захиалга' }]),
      children: buildLineChart([{ color: PRIMARY, data: d.bkgByDay }], d.dayLabels),
    })}
    ${cardHtml({
      title: 'Захиалгын төлөв',
      sub: 'Энэ сард',
      children: statuses.map(r => `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100)">
        <span style="font-size:.8125rem;color:var(--gray-700)">${escHtml(r.label)}</span>
        <span style="font-size:1rem;font-weight:700;color:${r.color}">${r.n}<span style="font-size:.75rem;margin-left:4px;">${typeof r.pct==='number'?'('+r.pct+'%)':r.pct}</span></span>
      </div>`).join(''),
    })}
    ${cardHtml({
      spanFull: true,
      title: 'Захиалгын хураангуй',
      children: `<div class="status-grid">
        ${statuses.map((r, i) => `<div class="status-cell"${i===3?' style="border-right:none"':''}>
          <div class="status-cell-label">${escHtml(r.label)}</div>
          <div><span class="status-num">${r.n}</span><span class="status-pct" style="color:${r.color}">${typeof r.pct==='number'?r.pct+'%':r.pct}</span></div>
        </div>`).join('')}
      </div>`,
    })}
  </div>`;
}

// ── Staff tab ─────────────────────────────────────────────────────
function renderStaff() {
  document.getElementById('rpt-tab-staff').innerHTML =
    cardHtml({ spanFull: true, title: 'Ажилтан', children: emptyStateHtml('👥', 'Ажилтаны тайлан тун удахгүй нэмэгдэнэ', 'Ажилтан бүртгэж, захиалгыг ажилтанд хуваарилах боломж ойрын хугацаанд нэмэгдэнэ.') });
}

// ── Customers tab ─────────────────────────────────────────────────
function renderCustomers() {
  const d = _rptData;
  if (!d || d.total === 0) {
    document.getElementById('rpt-tab-customers').innerHTML =
      cardHtml({ spanFull: true, title: 'Харилцагч', children: emptyStateHtml('👤', 'Харилцагч байхгүй байна', 'Захиалга хүлээн авсны дараа харилцагчийн тайлан гарна.') });
    return;
  }

  const guestStatCards = [
    { label:'Нийт харилцагч', value: d.uniqueGuests,    color: PRIMARY },
    { label:'Дахин ирсэн',    value: d.returningGuests, color: '#10B981' },
    { label:'Шинэ харилцагч', value: d.newGuests,        color: '#6366F1' },
  ].map(s => `<div style="flex:1;padding:14px 18px;border-right:1px solid var(--gray-100);last-child{border:none}">
    <div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-400);margin-bottom:6px;">${escHtml(s.label)}</div>
    <div style="font-size:1.5rem;font-weight:800;color:${s.color}">${s.value}</div>
  </div>`).join('');

  const reviewsHtml = d.reviews.length
    ? d.reviews.map(r => {
        const stars = Math.max(0, Math.min(5, Math.round(r.rating || 0)));
        const when  = r.created_at ? new Date(r.created_at).toLocaleDateString('mn-MN') : '';
        return `<div class="review-row">
          <div class="review-avatar">★</div>
          <div style="flex:1">
            <div class="review-meta">
              <span class="review-stars">${'★'.repeat(stars)}<span style="color:var(--gray-200)">${'★'.repeat(5-stars)}</span></span>
              <span class="review-when">${escHtml(when)}</span>
            </div>
            ${r.comment ? `<div class="review-text">${escHtml(r.comment)}</div>` : ''}
          </div>
        </div>`;
      }).join('')
    : '<div style="padding:20px 0;color:var(--gray-400);font-size:.875rem;">Үнэлгээ байхгүй байна.</div>';

  document.getElementById('rpt-tab-customers').innerHTML = `<div class="rpt-grid">
    ${cardHtml({
      title: 'Захиалгын динамик',
      right: legendHtml([{ color: PRIMARY, label: 'Захиалга' }]),
      children: buildLineChart([{ color: PRIMARY, data: d.bkgByDay }], d.dayLabels),
    })}
    ${cardHtml({
      title: 'Харилцагчийн хураангуй',
      children: `<div style="display:flex;border:1px solid var(--gray-100);border-radius:10px;overflow:hidden;margin-bottom:12px;">${guestStatCards}</div>
        <div style="font-size:.6875rem;color:var(--gray-400);">* Утасны дугаараар ялгасан тоо</div>`,
    })}
    ${cardHtml({
      spanFull: true,
      title: 'Сүүлийн үнэлгээнүүд',
      children: reviewsHtml,
    })}
  </div>`;
}

// ── Marketing tab ─────────────────────────────────────────────────
function renderMarketing() {
  document.getElementById('rpt-tab-marketing').innerHTML =
    cardHtml({ spanFull: true, title: 'Маркетинг', children: emptyStateHtml('📣', 'Маркетингийн тайлан тун удахгүй нэмэгдэнэ', 'МонМэп апп дахь үзэлт, дарсан тоо болон захиалга хөрвөлтийн статистик ойрын хугацаанд нэмэгдэнэ.') });
}

}
